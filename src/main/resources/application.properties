spring.application.name=bookmyshow
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port
server.port=${PORT:8080}

# Load local secrets from common launch locations when present
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.api.base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}

# Show dates and times are interpreted in the venue's local time zone.
booking.time-zone=${BOOKING_TIME_ZONE:Asia/Kolkata}

# Seed admin account
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://book-my-show-frontend-liart.vercel.app,http://localhost:5500,http://127.0.0.1:5500}

